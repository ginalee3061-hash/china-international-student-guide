<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Student Guide</title>
<style>
:root{--cream:#f8f3e5;--ink:#2b2d2f;--muted:#6f6c66;--paper:#fffdf7;--blue:#a7c9db;--blue-dark:#667f91;--rose:#d79ea2;--rose-dark:#91676b;--olive:#d8cc9e;--olive-dark:#908664;--cyan:#58c7cb;--line:#242729}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit}button,input{font:inherit}
.topbar{position:sticky;top:0;z-index:50;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(248,243,229,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(40,40,40,.16)}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:900;font-size:17px}.brand-dot{width:22px;height:22px;border-radius:50%;background:var(--ink)}.topnav{display:flex;gap:22px}.topnav a{font-size:13px;text-decoration:none}.topnav a:hover{text-decoration:underline}
#app{min-height:80vh}.container{width:min(1240px,calc(100% - 48px));margin:0 auto}
.hero{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:65px 0 95px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.kicker{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(58px,8.5vw,118px);line-height:.84;letter-spacing:-.07em;margin:15px 0 26px}.hero-copy{max-width:650px;font-size:19px;line-height:1.45;color:var(--muted)}.search{display:flex;gap:10px;margin-top:30px;max-width:620px}.search input{min-width:0;flex:1;padding:15px 17px;border:1.5px solid var(--line);background:transparent;border-radius:999px;outline:none}.btn{border:1.5px solid var(--line);padding:14px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:900;cursor:pointer}
.hero-art{min-height:500px;display:grid;place-items:center;position:relative}.hero-card{width:min(430px,90%);background:var(--paper);border:1.5px solid var(--line);border-radius:42px;padding:34px;box-shadow:0 20px 44px rgba(0,0,0,.12);transform:rotate(-3deg)}.hero-card h2{font-size:54px;line-height:.9;letter-spacing:-.06em;margin:13px 0 24px}.hero-line{height:12px;border-radius:99px;background:var(--cyan);margin:10px 0;width:63%}.hero-line:nth-child(2){width:46%;background:#efcfd2}.hero-note{position:absolute;right:2%;bottom:5%;padding:11px 15px;background:var(--ink);color:#fff;border-radius:13px;font-size:12px;transform:rotate(6deg)}
.band{padding:0 0 80px}.band.blue{background:var(--blue)}.band.rose{background:var(--rose)}.band.olive{background:var(--olive)}.tab{display:flex;justify-content:space-between;align-items:center;width:min(720px,76%);margin-left:-24px;padding:18px 34px;border-radius:0 0 34px 0;color:#fff;font-weight:900;font-size:23px;letter-spacing:-.03em}.blue .tab{background:var(--blue-dark)}.rose .tab{background:var(--rose-dark)}.olive .tab{background:var(--olive-dark)}.tab .arrow{font-size:28px;font-weight:400}.band-intro{max-width:720px;margin:20px auto 26px;color:rgba(35,35,35,.73);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.card{position:relative;min-height:420px;padding:104px 30px 28px;background:var(--paper);border:1.5px solid var(--line);border-radius:42px;text-decoration:none;display:flex;flex-direction:column;transition:.18s ease;box-shadow:0 15px 30px rgba(35,35,35,.09)}.card:hover{transform:translateY(-4px);box-shadow:0 24px 44px rgba(35,35,35,.14)}.polaroid{position:absolute;right:-12px;top:-35px;width:154px;padding:10px 10px 33px;background:#f4efe1;box-shadow:0 10px 22px rgba(0,0,0,.09);transform:rotate(6deg)}.polaroid-box{height:112px;display:grid;place-items:center;font-weight:900;font-size:50px;background:#dfe5df}.polaroid-box.alipay,.app-visual.alipay,.app-logo.alipay{background:#0877ee;color:white}.polaroid-box.cainiao,.app-visual.cainiao,.app-logo.cainiao{background:#176ff5;color:#12e0b9}.polaroid-box.didi,.app-visual.didi,.app-logo.didi{background:#ffe99b}.card h3{font-size:33px;line-height:.98;letter-spacing:-.045em;margin:12px 0 16px}.card p{margin:0;color:var(--muted);font-size:16px}.grow{flex:1}.learn{display:inline-flex;align-self:flex-start;padding:11px 18px;border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:900;margin-top:23px}
.page{padding:68px 0 100px}.breadcrumbs{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:26px}.breadcrumbs a{text-decoration:none}.page-head{max-width:900px;margin-bottom:44px}.page-head h1{font-size:clamp(50px,7vw,90px);line-height:.88;letter-spacing:-.06em;margin:8px 0 16px}.page-head p{font-size:18px;max-width:720px;color:var(--muted)}
.app-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.app-card{text-decoration:none;border:1.5px solid var(--line);background:var(--paper)}.app-visual{aspect-ratio:1;display:grid;place-items:center;font-size:92px;font-weight:900}.app-info{display:flex;justify-content:space-between;align-items:center;border-top:1.5px solid var(--line);padding:13px 17px}.app-info strong{font-size:17px}.triangle{font-size:26px}.app-shell{background:var(--paper);border:1.5px solid var(--line);border-radius:36px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,.1)}.app-top{display:grid;grid-template-columns:270px 1fr;gap:35px;align-items:center}.app-logo{aspect-ratio:1;display:grid;place-items:center;font-size:104px;font-weight:900;border:1.5px solid var(--line);border-radius:18px}.app-top h2{font-size:58px;line-height:.9;letter-spacing:-.055em;margin:8px 0 14px}.app-top p{max-width:680px;color:var(--muted);font-size:17px}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:900}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);margin-top:28px}.info-box{padding:22px;border-top:1px solid var(--line)}.info-box h3{margin:0 0 8px}.info-box p{margin:0;color:var(--muted)}
.related{margin-top:80px;padding-top:36px;border-top:1.5px solid var(--line)}.related h2{font-size:42px;letter-spacing:-.05em;margin:0 0 20px}.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.guide-grid{display:grid;grid-template-columns:145px 1fr;gap:46px}.rail{position:sticky;top:102px;height:calc(100vh - 140px);align-self:start}.rail-track,.rail-fill{position:absolute;left:34px;top:8px;bottom:8px;width:4px;border-radius:99px}.rail-track{background:#ddd9ca}.rail-fill{height:0;background:var(--cyan);bottom:auto}.dots{position:absolute;inset:0;display:flex;flex-direction:column}.dot-item{position:relative;flex:1}.dot{position:absolute;left:15px;top:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--cream);font-size:12px;font-weight:900;z-index:2}.dot-item.active .dot,.dot-item.done .dot{background:var(--cyan)}.guide-title h1{font-size:clamp(52px,7vw,94px);line-height:.88;letter-spacing:-.06em;margin:0 0 18px}.guide-title p{font-size:18px;color:var(--muted);max-width:760px}.steps{display:grid;gap:100px;margin-top:56px}.step{min-height:500px}.step-kicker{font:900 17px/1 monospace;margin-bottom:18px}.step-layout{display:grid;grid-template-columns:1fr .9fr;gap:50px;align-items:start}.step-copy h2{font-size:43px;line-height:.95;letter-spacing:-.045em;margin:0 0 15px}.step-copy p{color:var(--muted);font-size:17px;max-width:600px}.note{margin-top:18px;padding:13px 15px;border-left:4px solid var(--cyan);background:#efede4;color:#5f5c55}.step-img{min-height:390px;border:1.5px solid var(--line);background:var(--paper);border-radius:21px;overflow:hidden;display:grid;place-items:center}.step-img img{width:100%;height:auto;max-height:650px;object-fit:contain}.placeholder{padding:35px;text-align:center;color:var(--muted)}
.footer{max-width:1240px;margin:auto;padding:60px 30px 80px;color:var(--muted);border-top:1px solid rgba(0,0,0,.16);font-size:13px;display:flex;justify-content:space-between;gap:30px}.search-results{display:grid;gap:12px}.result{display:block;background:var(--paper);border:1.5px solid var(--line);padding:17px 19px;text-decoration:none}.result strong{display:block;font-size:17px}.result span{font-size:13px;color:var(--muted)}.empty{padding:30px;border:1px dashed #c6c0af;background:rgba(255,255,255,.3);color:var(--muted)}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-art{min-height:340px}.cards,.app-grid,.related-grid{grid-template-columns:1fr 1fr}.app-top{grid-template-columns:220px 1fr}.step-layout{grid-template-columns:1fr}.guide-grid{grid-template-columns:84px 1fr}}
@media(max-width:620px){.topbar{padding:0 16px}.topnav{gap:10px}.topnav a{font-size:11px}.container{width:calc(100% - 28px)}.hero{padding:45px 0 70px}.hero h1{font-size:57px}.hero-copy{font-size:16px}.cards,.app-grid,.related-grid,.info-grid{grid-template-columns:1fr}.tab{width:92%;margin-left:-14px;font-size:16px;padding:14px 20px}.card{min-height:390px}.app-top{grid-template-columns:1fr}.app-logo{max-width:260px}.guide-grid{grid-template-columns:1fr}.rail{display:none}.steps{gap:60px}.step-img{min-height:280px}.footer{flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="brand-dot"></span><span>China Student Guide</span></a>
  <nav class="topnav"><a href="#/recommended-apps">Recommended Apps</a><a href="#/search">Search</a><a href="#/faq">FAQ</a></nav>
</header>
<main id="app"></main>
<footer class="footer"><div><strong style="color:var(--ink)">China Student Guide</strong><br>Practical help for the everyday things you need to figure out in China.</div><span>V3 fixed prototype · GitHub Pages</span></footer>

<script>
const root=document.querySelector("#app");
const DATA={};
async function load(name){
  if(!DATA[name]){
    const r=await fetch("./data/"+name+".json?"+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("Could not load data/"+name+".json");
    DATA[name]=await r.json();
  }
  return DATA[name];
}
const by=(a,k,v)=>a.find(x=>String(x[k])===String(v));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const titleOf=g=>g?.title||g?.guide_title||"Guide";
const itemName=i=>i?._display_name||i?.name||"";
const iconFor=i=>i?.visual?.logo_text||"✦";
const clsFor=i=>i?.visual?.logo_class||"default";
function crumbs(ps){return '<div class="breadcrumbs">'+ps.map((p,i)=>`${i?'<span>›</span>':''}${p.href?`<a href="#${p.href}">${esc(p.label)}</a>`:`<span>${esc(p.label)}</span>`}`).join('')+'</div>'}
function guideCard(g,it){return `<a class="card" href="#/guide/${g.guide_id}"><div class="polaroid"><div class="polaroid-box ${esc(clsFor(it))}">${esc(iconFor(it))}</div></div><div class="eyebrow">${esc(itemName(it))}</div><h3>${esc(titleOf(g))}</h3><p>${esc(g.short_description||"")}</p><div class="grow"></div><span class="learn">LEARN MORE</span></a>`}
function appCard(it){return `<a class="app-card" href="#/item/${it.item_id}"><div class="app-visual ${esc(clsFor(it))}">${esc(iconFor(it))}</div><div class="app-info"><strong>${esc(itemName(it))}</strong><span class="triangle">▶</span></div></a>`}

async function home(){
  const [items,guides,groups]=await Promise.all([load("items"),load("guides"),load("featured-groups")]);
  const pub=new Map(guides.filter(g=>g.status==="published").map(g=>[g.guide_id,g]));
  root.innerHTML=`<section class="hero"><div class="container hero-grid"><div><div class="kicker">THE INTERNATIONAL STUDENT GUIDE</div><h1>WHAT DO I NEED<br>TO FIGURE OUT?</h1><p class="hero-copy">A visual, practical guide to the everyday systems you suddenly need to understand after arriving in China.</p><form class="search" id="hs"><input name="q" placeholder="Try “packages”, “Alipay”, “metro”"><button class="btn">SEARCH</button></form></div><div class="hero-art"><div class="hero-card"><div class="kicker">START HERE</div><h2>ONE TASK<br>AT A TIME.</h2><div class="hero-line"></div><div class="hero-line"></div><p>Choose a topic, pick what you need, and follow the steps.</p></div><div class="hero-note">No university jargon. Just what to do.</div></div></div></section>
  <div>${groups.map(gr=>{const gs=gr.guide_ids.map(id=>pub.get(id)).filter(Boolean).slice(0,3);return `<section class="band ${gr.theme}"><div class="container"><div class="tab"><span>${esc(gr.number)} ${esc(gr.title)}</span><span class="arrow">→</span></div><div class="band-intro">${esc(gr.description)}</div><div class="cards">${gs.map(g=>guideCard(g,by(items,"item_id",g.item_id))).join("")}</div></div></section>`}).join("")}</div>`;
  document.querySelector("#hs").addEventListener("submit",e=>{e.preventDefault();const q=new FormData(e.currentTarget).get("q")||"";location.hash="/search?q="+encodeURIComponent(q)})
}
async function appsPage(){const items=await load("items");const apps=items.filter(i=>i.item_type==="app");root.innerHTML=`<section class="page"><div class="container">${crumbs([{label:"Home",href:"/"},{label:"Recommended Apps"}])}<div class="page-head"><div class="kicker">START WITH THESE</div><h1>RECOMMENDED APPS</h1><p>The apps that solve a surprising number of everyday problems once you arrive.</p></div><div class="app-grid">${apps.map(appCard).join("")}</div></div></section>`}
async function itemPage(id){
  const [items,guides,details]=await Promise.all([load("items"),load("guides"),load("app-details")]);const it=by(items,"item_id",id);if(!it)return notFound();const d=details[id]||{tagline:"Useful everyday tool",intro:it._display_description,recommended:"Learn only the parts you need.",related_guide_ids:guides.filter(g=>g.item_id===id&&g.status==="published").map(g=>g.guide_id)};const rs=(d.related_guide_ids||[]).map(x=>by(guides,"guide_id",x)).filter(g=>g&&g.status==="published");root.innerHTML=`<section class="page"><div class="container">${crumbs([{label:"Home",href:"/"},{label:"Recommended Apps",href:"/recommended-apps"},{label:itemName(it)}])}<div class="app-shell"><div class="app-top"><div class="app-logo ${esc(clsFor(it))}">${esc(iconFor(it))}</div><div><div class="kicker">${esc(it.chinese_name||it.item_type||"app")}</div><h2>${esc(itemName(it))}</h2><p><strong>${esc(d.tagline||"")}</strong><br>${esc(d.intro||"")}</p><div class="pills">${it.platform?`<span class="pill">${esc(it.platform)}</span>`:""}${it.importance?`<span class="pill">${esc(it.importance)}</span>`:""}</div></div></div><div class="info-grid"><div class="info-box"><h3>WHEN YOU’LL USE IT</h3><p>${esc(d.recommended||"")}</p></div><div class="info-box"><h3>START HERE</h3><p>Pick one guide below instead of learning the whole app at once.</p></div></div></div><section class="related"><h2>RELATED</h2><div class="related-grid">${rs.map(g=>guideCard(g,it)).join("")||'<div class="empty">More guides coming soon.</div>'}</div></section></div></section>`}
async function guidePage(id){
  const [items,guides,steps,shots]=await Promise.all([load("items"),load("guides"),load("steps"),load("screenshots")]);const g=by(guides,"guide_id",id);if(!g)return notFound();const it=by(items,"item_id",g.item_id);const ss=steps.filter(s=>String(s.guide_id)===String(id)).sort((a,b)=>(a.step_number||0)-(b.step_number||0));const shotMap=new Map(shots.map(x=>[x.image_id,x]));
  root.innerHTML=`<section class="page"><div class="container">${crumbs([{label:"Home",href:"/"},{label:itemName(it),href:`/item/${it?.item_id||""}`},{label:titleOf(g)}])}<div class="guide-grid"><aside class="rail"><div class="rail-track"></div><div class="rail-fill" id="fill"></div><div class="dots">${ss.map((s,i)=>`<div class="dot-item" data-dot="${i}"><div class="dot">${i+1}</div></div>`).join("")}</div></aside><article><header class="guide-title"><div class="kicker">${esc(itemName(it))}</div><h1>${esc(titleOf(g))}</h1><p>${esc(g.user_question||g.short_description||"")}</p></header><div class="steps">${ss.map((s,i)=>{const sh=shotMap.get(s.image_id);const path=s.image_path;return `<section class="step" data-step="${i}"><div class="step-kicker">[ ${String(i+1).padStart(2,"0")} ] ${esc(s.step_title||"STEP")}</div><div class="step-layout"><div class="step-copy"><h2>${esc(s.step_title||"")}</h2><p>${esc(s.instruction||"")}</p>${s.tip?`<div class="note">${esc(s.tip)}</div>`:""}${s.warning?`<div class="note">${esc(s.warning)}</div>`:""}</div>${path?`<div class="step-img"><img src="${esc(path)}" alt="${esc(s.alt_text||sh?.alt_text||s.step_title||"Guide image")}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=&quot;placeholder&quot;>Image not found:<br><small>${esc(sh?.filename||"filename")}</small></div>'"></div>`:`<div class="step-img placeholder">Screenshot placeholder<br><small>${esc(sh?.filename||s.image_id||"Add image later")}</small></div>`}</div></section>`}).join("")}</div><section class="related"><h2>YOU MAY ALSO NEED</h2><div class="related-grid">${guides.filter(x=>x.status==="published"&&x.guide_id!==id&&x.item_id===g.item_id).slice(0,3).map(x=>guideCard(x,it)).join("")}</div></section></article></div></div></section>`;
  const fill=document.getElementById("fill"), secs=[...document.querySelectorAll("[data-step]")], dots=[...document.querySelectorAll("[data-dot]")];
  function prog(){if(!secs.length)return;const first=secs[0],last=secs[secs.length-1],a=first.getBoundingClientRect().top+scrollY,b=last.getBoundingClientRect().bottom+scrollY;const pct=Math.max(0,Math.min(100,((scrollY-a+120)/(b-a))*100));fill.style.height=pct+"%";secs.forEach((s,i)=>{const r=s.getBoundingClientRect();const on=r.top<innerHeight*.48&&r.bottom>0;dots[i]?.classList.toggle("active",on);if(r.bottom<innerHeight*.48)dots[i]?.classList.add("done");else dots[i]?.classList.remove("done")})}addEventListener("scroll",prog,{passive:true});prog()}
async function searchPage(q=""){const[items,guides]=await Promise.all([load("items"),load("guides")]);const s=q.toLowerCase().trim(),rs=guides.filter(g=>g.status==="published").filter(g=>[titleOf(g),g.short_description,g.user_question,itemName(by(items,"item_id",g.item_id)),by(items,"item_id",g.item_id)?.chinese_name].filter(Boolean).join(" ").toLowerCase().includes(s));root.innerHTML=`<section class="page"><div class="container">${crumbs([{label:"Home",href:"/"},{label:"Search"}])}<div class="page-head"><div class="kicker">FIND A GUIDE</div><h1>SEARCH</h1><p>Search by task, app, service, or the thing you are trying to do.</p></div><form class="search" id="sf"><input name="q" value="${esc(q)}" placeholder="e.g. Alipay, package, metro"><button class="btn">SEARCH</button></form><div class="search-results">${rs.map(g=>`<a class="result" href="#/guide/${g.guide_id}"><strong>${esc(titleOf(g))}</strong><span>${esc(itemName(by(items,"item_id",g.item_id)))}</span></a>`).join("")||'<div class="empty">No published guides match this search yet.</div>'}</div></div></section>`;document.querySelector("#sf").addEventListener("submit",e=>{e.preventDefault();const v=new FormData(e.currentTarget).get("q")||"";location.hash="/search?q="+encodeURIComponent(v)})}
function faqPage(){root.innerHTML=`<section class="page"><div class="container">${crumbs([{label:"Home",href:"/"},{label:"FAQ"}])}<div class="page-head"><div class="kicker">QUICK ANSWERS</div><h1>FAQ</h1><p>Common questions will live here as the guide grows.</p></div><div class="search-results"><details class="result"><summary><strong>Which apps should I set up first?</strong></summary><p>Start with the apps you need for payments, transport, parcels, campus services and communication.</p></details><details class="result"><summary><strong>What happens to unfinished guides?</strong></summary><p>They can stay in your data with a draft or collecting status and remain out of the public interface until ready.</p></details></div></div></section>`}
function notFound(){root.innerHTML='<section class="page"><div class="container"><div class="empty"><strong>Page not found.</strong><br><a href="#/">Back to home</a></div></div></section>'}
async function route(){const raw=location.hash.replace(/^#/,"")||"/";const[p,q]=raw.split("?");const params=new URLSearchParams(q||"");scrollTo(0,0);if(p==="/")return home();if(p==="/recommended-apps")return appsPage();if(p==="/search")return searchPage(params.get("q")||"");if(p==="/faq")return faqPage();const x=p.split("/");if(x[1]==="item")return itemPage(x[2]);if(x[1]==="guide")return guidePage(x[2]);return notFound()}
addEventListener("hashchange",()=>route().catch(e=>{console.error(e);notFound()}));
route().catch(e=>{console.error(e);root.innerHTML='<section class="page"><div class="container"><div class="empty"><strong>Site data could not be loaded.</strong><br>Make sure the <code>data</code> folder is beside <code>index.html</code>.</div></div></section>'});
</script>
</body>
</html>
