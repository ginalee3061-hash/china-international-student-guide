<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Life Survival Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="site-header">
    <div class="logo-area">CAMPUS LIFE GUIDE</div>
    <nav class="category-nav" id="categoryNav"></nav>
  </header>

  <!-- 主内容卡片区 -->
  <main class="main-container">
    <section class="feed-section" id="feedSection">
      <!-- 动态由 script.js 渲染 -->
    </section>
  </main>

  <!-- 指南步骤弹窗 -->
  <div class="guide-modal-overlay" id="guideModal" aria-hidden="true">
    <div class="guide-modal-container">
      <button class="modal-close-btn" id="closeGuideModal" aria-label="Close">✕</button>
      <div class="guide-modal-header">
        <h2 class="modal-guide-title" id="modalGuideTitle">HOW TO GET MY PACKAGES?</h2>
        <p class="modal-guide-desc" id="modalGuideDesc"></p>
      </div>
      <div class="guide-steps-scroll" id="modalStepsScroll"></div>
    </div>
  </div>

  <!-- 底部拟物 Building 12 文件夹 -->
  <aside class="dossier-dock">
    <div class="folder-trigger" id="folderTrigger">
      <div class="folder-tab">
        <span class="folder-label-text">Building 12</span>
        <div class="polaroid-stamp">
          <div class="stamp-inner"></div>
        </div>
      </div>
      <div class="folder-pocket-edge"></div>
    </div>
  </aside>

  <!-- 抽出的 Building 12 档案纸张 -->
  <div class="dossier-modal-overlay" id="dossierModal" aria-hidden="true">
    <div class="dossier-wrapper">
      <div class="manila-folder-back"></div>
      
      <article class="typewriter-paper" id="paperContainer">
        <div class="paper-header-tabs">
          <span class="confidential-tag">OFFICIAL DORMITORY RECORD</span>
          <div class="pagination-controls">
            <button class="page-arrow" id="prevPageBtn" title="Previous page">‹</button>
            <span class="page-indicator" id="pageIndicator">Page 1 / 3</span>
            <button class="page-arrow" id="nextPageBtn" title="Next page">›</button>
          </div>
          <button class="dossier-close-btn" id="closeDossierBtn" title="Close folder">✕</button>
        </div>

        <div class="paper-page-content" id="paperPageContent"></div>
      </article>
    </div>
  </div>

  <!-- 复制 Toast 提示 -->
  <div class="toast-notice" id="toastNotice">Address copied to clipboard!</div>

  <!-- 这里是引用外部 JS 文件，代码写在 script.js 里即可 -->
  <script src="script.js"></script>
</body>
</html>
